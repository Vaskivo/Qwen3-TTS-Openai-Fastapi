# Qwen3-TTS server configuration
# Copy this file to ~/qwen3-tts/config.yaml (or point TTS_CONFIG to its location).
# The optimized backend reads this file at startup.

# Model to load for NON-clone requests (built-in voices, custom voices).
# Must match a key in the `models` section below.  Non-clone generation uses
# generate_custom_voice, so this must be a `customvoice`-type model.
# default_model: 0.6B-CustomVoice
default_model: 1.7B-CustomVoice

# Model to load for voice-cloning requests (clone: prefix, voice library,
# /v1/audio/voice-clone).  Must be a `base`-type model from `models` below.
voice_clone_model: 1.7B-Base

# Optional: VoiceDesign model for natural-language voice-style instructions.
# The optimized backend has no generate_voice_design path today, so this key
# only makes the model discoverable/configurable here; run it via the official
# backend (TTS_BACKEND=official, TTS_MODEL_NAME=<the hf_id below>) or qwen_tts.
# Must name a `voice_design`-type key in `models`.  Comment out to disable.
voice_design_model: 1.7B-VoiceDesign

# Whether to keep both `default_model` and `voice_clone_model` resident in
# VRAM at the same time.
#   true  — load both once (lazily on first use, or eagerly at startup when
#           TTS_WARMUP_ON_START=true); no model swapping afterward.
#   false — keep only one model loaded at a time; switch (unload + load) when a
#           request needs the other model.  Lower VRAM, higher per-switch latency.
load_both_models: false

# Available models.  Each entry maps a short name to a HuggingFace repo id (or
# a local path) and a model type.
#
# - customvoice   — predefined speakers (Vivian, Ryan, …); fastest for bulk TTS
# - base          — required for voice cloning (clone: prefix) and voice library
# - voice_design  — voice-style instructions via generate_voice_design
#                   (official backend / qwen_tts only; not in the optimized API)
models:
  1.7B-Base:
    hf_id: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    type: base
  1.7B-CustomVoice:
    hf_id: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
    type: customvoice
  1.7B-VoiceDesign:
    hf_id: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    type: voice_design
  0.6B-CustomVoice:
    hf_id: Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice
    type: customvoice
  0.6B-Base:
    hf_id: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    type: base

# Performance optimizations (only used with TTS_BACKEND=optimized)
# Note: attention implementation is configured via the TTS_ATTN env var (shared
# with the official backend), not here.
optimization:
  # torch.compile mode.  Options: default | reduce-overhead | max-autotune
  # max-autotune gives the best throughput after a ~75 s compilation on first start.
  # compile_mode: max-autotune
  compile_mode: default


  # Whether to enable torch.compile at all.  Set to false to skip compilation
  # (faster startup, lower throughput).
  # use_compile: true
  use_compile: false

  # Whether to capture CUDA graphs (works on both CUDA and ROCm).
  # Required for max-autotune to reach peak performance.
  use_cuda_graphs: false   # set true after verifying compile works on your GPU

  # Fast codebook generation (bypasses HuggingFace generate() overhead).
  use_fast_codebook: true

  # Compile the codebook predictor as well (default true, recommended).
  compile_codebook_predictor: true

  # Streaming-specific parameters
  streaming:
    # Window size (frames) for the sliding streaming decoder.
    # AMD ROCm: use 72 (values 66/67/71 trigger a CUDA graph capture bug).
    # NVIDIA CUDA: 64, 72, or 80 all work.
    decode_window_frames: 80

    # Emit a PCM chunk every N decoded frames.  Lower = lower TTFB but slightly
    # higher RTF cost.  Recommended: 6 (good TTFB/RTF balance for voice agents).
    emit_every_frames: 6

# Built-in voice definitions (used by the /v1/voices endpoint when the optimized
# backend is active).  You can add/remove entries here freely.
voices:
  - name: Vivian
    language: Chinese
  - name: Serena
    language: Chinese
  - name: Uncle_Fu
    language: Chinese
  - name: Dylan
    language: Chinese
  - name: Eric
    language: Chinese
  - name: Ryan
    language: English
  - name: Aiden
    language: Japanese
  - name: Ono_Anna
    language: Korean
  - name: Sohee
    language: English

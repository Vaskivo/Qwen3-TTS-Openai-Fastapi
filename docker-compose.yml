services:
  qwen3-tts-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: qwen3-tts-api
    ports:
      - "${TTS_PORT:-8880}:8880"
    env_file: .env
    environment:
      # TTS_MODEL_NAME: "${TTS_MODEL_NAME:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}"
      # TTS_MODEL_NAME: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
      # NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TORCHINDUCTOR_COMPILE_THREADS: 1
    volumes:
      - ./VOICES:/VOICES
      - ./config.yaml:/home/appuser/qwen3-tts/config.yaml
      - /mnt/CODE/AI_MODELS/TTS:/MODELS/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # count: 1
              device_ids: ["1"]
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

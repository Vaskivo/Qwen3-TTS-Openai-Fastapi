services:
  qwen3-tts-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: qwen3-tts-api
    ports:
      - "${TTS_PORT:-8880}:8880"
    environment:
      HOST: 0.0.0.0
      PORT: 8880
      WORKERS: 1
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      # TTS_BACKEND: official
      TTS_BACKEND: optimized
      # TTS_MODEL_NAME: "${TTS_MODEL_NAME:-Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice}"
      TTS_MODEL_NAME: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"
      TTS_WARMUP_ON_START: "${TTS_WARMUP_ON_START:-false}"
      TTS_IDLE_TIMEOUT_SECONDS: "${TTS_IDLE_TIMEOUT_SECONDS:-0}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      VOICE_LIBRARY_DIR: /VOICES
      TORCHINDUCTOR_COMPILE_THREADS: 1
      # Folder holding local model snapshots (one subdir per model, repo name
      # without the org prefix, e.g. /MODELS/Qwen3-TTS-12Hz-1.7B-Base). Required:
      # this build loads models only from local paths — it does not use the
      # HuggingFace cache and never downloads.
      TTS_MODELS_DIR: /MODELS
    volumes:
      - ./VOICES:/VOICES
      - ./config.yaml:/home/appuser/qwen3-tts/config.yaml
      - /mnt/CODE/AI_MODELS/TTS:/MODELS/
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # count: 1
              device_ids: ["1"]
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
